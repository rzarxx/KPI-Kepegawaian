<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16A34A" />
    <title>Koneksi tidak tersedia</title>
    <style>
      body { align-items: center; background: #F8FAFC; color: #0F172A; display: flex; font-family: Inter, system-ui, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 28px rgba(15,23,42,.04); max-width: 420px; padding: 32px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      p { color: #64748B; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
      button { background: #16A34A; border: 0; border-radius: 9px; color: #FFFFFF; cursor: pointer; font: inherit; font-weight: 600; min-height: 40px; padding: 0 16px; }
      button:focus-visible { outline: 2px solid #16A34A; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Koneksi tidak tersedia</h1>
      <p>Data karyawan memerlukan koneksi aktif untuk menjaga keamanan dan konsistensi data.</p>
      <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
